<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="420" rx="32" fill="#FBF8F4" />
  <text x="72" y="82" font-size="40" font-weight="800" fill="#2E2631">README 证据边界</text>
  <text x="72" y="118" font-size="20" fill="#625667">所有公开信息分三条通道展示，防止把概念图、文件数量和真实可玩程度混在一起。</text>
  
  <g transform="translate(72 170)">
    <rect width="404" height="184" rx="28" fill="#DCEEE4" />
    <text x="28" y="58" font-size="28" font-weight="800" fill="#254C39">真实可玩证据</text>
    <foreignObject x="28" y="84" width="348" height="74">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px;line-height:1.6;color:#254C39;font-family:'Microsoft YaHei UI','PingFang SC',sans-serif;">
        只放真实运行截图、构建验证、代码中可确认的当前功能。
      </div>
    </foreignObject>
  </g>
  <g transform="translate(548 170)">
    <rect width="404" height="184" rx="28" fill="#F6E3E3" />
    <text x="28" y="58" font-size="28" font-weight="800" fill="#6F2F43">AI 概念视觉</text>
    <foreignObject x="28" y="84" width="348" height="74">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px;line-height:1.6;color:#6F2F43;font-family:'Microsoft YaHei UI','PingFang SC',sans-serif;">
        只负责表达宇宙气质、角色气质和世界氛围，不冒充可玩程度。
      </div>
    </foreignObject>
  </g>
  <g transform="translate(1024 170)">
    <rect width="404" height="184" rx="28" fill="#E2EAF7" />
    <text x="28" y="58" font-size="28" font-weight="800" fill="#24456E">自动统计与清单</text>
    <foreignObject x="28" y="84" width="348" height="74">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px;line-height:1.6;color:#24456E;font-family:'Microsoft YaHei UI','PingFang SC',sans-serif;">
        由脚本回算地图、节点、Schema、Skill、截图清单和素材元数据。
      </div>
    </foreignObject>
  </g>
</svg>
