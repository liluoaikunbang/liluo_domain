name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run project:gate:ci
      - name: Upload quality-gate report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: reports/quality-gate/
          if-no-files-found: warn
          retention-days: 14
